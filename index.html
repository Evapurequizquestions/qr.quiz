
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#89c3ec" />
  <title>Evapure Quiz</title>

 <style>
  :root{
    /* BRAND COLOURS — Magnet UC */
    --yellow: #ffd400;
    --yellow-dark: #f4b800;
    --black: #111111;
    --blue: #1e5fd4;
    --blue-dark: #1648a8;
    --white: #ffffff;

    --wood: #cfa15d;
    --wood-dark: #b88945;

    --radius-lg: 18px;
    --radius-md: 14px;

    --shadow-heavy: 0 18px 40px rgba(0,0,0,.35);
    --shadow-light: 0 6px 14px rgba(0,0,0,.25);

    --font-head: Impact, Haettenschweiler, "Arial Black", sans-serif;
    --font-body: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    max-width: 820px;
    margin: 24px auto;
    padding: 0 16px;
    color: var(--black);

    background:
      radial-gradient(900px 500px at 50% -10%, var(--yellow) 0%, transparent 55%),
      linear-gradient(180deg, #ffe35a, var(--yellow-dark));
    min-height: 100vh;
  }

  .card {
    background:
      linear-gradient(180deg, var(--wood), var(--wood-dark));
    border-radius: var(--radius-lg);
    border: 4px solid var(--black);
    padding: 18px;
    box-shadow: var(--shadow-heavy);
    position: relative;
  }

  h1 {
    font-family: var(--font-head);
    font-size: 26px;
    margin: 0 0 10px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  #question {
    font-family: var(--font-head);
    font-size: 26px;
    line-height: 1.15;
    margin-top: 6px;
    text-transform: uppercase;
    text-shadow: 2px 2px 0 rgba(0,0,0,.15);
  }

  #meta {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 600;
    opacity: .8;
  }

  #answerBox {
    margin-top: 14px;
    padding: 14px;
    border-radius: var(--radius-md);
    background: var(--blue);
    color: var(--white);
    border: 3px solid var(--black);
    box-shadow: var(--shadow-light);
    display: none;
  }

  #answerLabel {
    font-weight: 900;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: .4px;
    font-size: 13px;
  }

  #answer {
    font-size: 20px;
    font-weight: 700;
  }

  .btnRow {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  button {
    padding: 12px 16px;
    border-radius: 999px;
    border: 3px solid var(--black);
    background: var(--white);
    font-size: 15px;
    font-weight: 800;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: var(--shadow-light);
  }

  button.primary {
    background: var(--blue);
    color: var(--white);
  }

  button:active {
    transform: translateY(2px);
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
  }

  .small {
    font-size: 13px;
    margin-top: 14px;
    font-weight: 600;
  }
</style>
</head>

<body>
  <div class="wrap">

    <div class="header">
      <div class="brand">
        <div class="logoBox" aria-label="Evapure logo">
          <!-- Put your logo file in the repo as evapure-logo.png -->
          <img src="evapure-logo.png" alt="Evapure" />
        </div>
        <div class="titles">
          <h1>Evapure Quiz</h1>
          <div class="sub">Scan • Play • Learn</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="question" id="question">Loading…</div>
  

      <div class="answer" id="answerBox">
        <div class="label"><span class="dot"></span>Answer</div>
        <div id="answer"></div>
      </div>

      <div class="row">
        <button class="primary" id="reveal">Reveal answer</button>
        <button id="next">Next question</button>
        <button class="ghost" id="reshuffle">Reshuffle bank</button>
      </div>

      <div class="note">
        Tip: “Next question” won’t repeat until the bank is exhausted (then reshuffle).
      </div>
    </div>

  </div>

<script>
  let bank = [];
  let pool = [];
  let current = null;

  async function loadBank(){
    const res = await fetch('questions.json', { cache: "no-store" });
    if(!res.ok) throw new Error('Could not load questions.json');
    const data = await res.json();
    if(!Array.isArray(data) || data.length === 0) throw new Error('Question bank empty/invalid');
    bank = data;
    
    reshuffle();
  }

  function shuffle(arr){
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function reshuffle(){
    pool = bank.slice();
    shuffle(pool);
    nextQ();
  }

  function nextQ(){
    document.getElementById('answerBox').style.display = 'none';

    if(pool.length === 0){
      document.getElementById('question').textContent = 'No more questions. Tap “Reshuffle bank”.';
      
      current = null;
      return;
    }

    current = pool.pop();
    document.getElementById('question').textContent = current.question ?? '(Missing question)';
    document.getElementById('answer').textContent = current.answer ?? '(Missing answer)';
    
  }

  document.getElementById('reveal').addEventListener('click', () => {
    if(!current) return;
    document.getElementById('answerBox').style.display = 'block';
  });

  document.getElementById('next').addEventListener('click', nextQ);
  document.getElementById('reshuffle').addEventListener('click', reshuffle);

  loadBank().catch(err => {
    document.getElementById('question').textContent = 'Couldn’t load the quiz bank.';
    document.getElementById('meta').textContent = err.message;
    document.getElementById('pill').textContent = 'Error';
    console.error(err);
  });
</script>
</body>
</html>
