
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#89c3ec" />
  <title>Evapure Quiz</title>

  <style>
    /* ===== Evapure brand palette ===== */
    :root{
      --evapure-primary: #89c3ec;  /* provided */
      --evapure-secondary: #628ca9;/* darker for contrast */
      --evapure-accent: #7bafd4;   /* highlight */
      --evapure-tint: #99daff;     /* light tint */

      --bg: #f7fbff;
      --card: #ffffff;
      --text: #0b2233;
      --muted: #527488;
      --border: rgba(98,140,169,.25);
      --shadow: 0 12px 30px rgba(11,34,51,.10);
      --radius: 18px;
    }

    *{ box-sizing: border-box; }

    body{
      margin: 0;
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1100px 520px at 12% 0%, rgba(137,195,236,.35), transparent 60%),
        radial-gradient(900px 460px at 92% 8%, rgba(123,175,212,.22), transparent 55%),
        radial-gradient(700px 380px at 50% 105%, rgba(153,218,255,.22), transparent 60%),
        var(--bg);
    }

    .wrap{
      max-width: 900px;
      margin: 26px auto;
      padding: 0 16px 28px;
    }

    /* ===== Header ===== */
    .header{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .brand{
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logoBox{
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: 0 10px 22px rgba(11,34,51,.08);
      display: grid;
      place-items: center;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .logoBox img{
      width: 86%;
      height: 86%;
      object-fit: contain;
      display: block;
    }

    .titles{
      min-width: 0;
    }

    .titles h1{
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .2px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .titles .sub{
      margin-top: 2px;
      color: var(--muted);
      font-size: 13px;
    }

    .pill{
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(98,140,169,.35);
      background: rgba(137,195,236,.16);
      color: var(--evapure-secondary);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* ===== Card ===== */
    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .question{
      font-size: 22px;
      font-weight: 850;
      line-height: 1.25;
      margin: 6px 0 8px;
    }

    .meta{
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
    }

    .answer{
      margin-top: 12px;
      padding: 14px;
      border-radius: 16px;
      display: none;
      border: 1px solid rgba(137,195,236,.45);
      background: linear-gradient(180deg, rgba(137,195,236,.20), rgba(153,218,255,.10));
    }

    .answer .label{
      font-weight: 850;
      margin-bottom: 6px;
      color: var(--evapure-secondary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot{
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--evapure-accent);
      box-shadow: 0 0 0 5px rgba(137,195,236,.22);
      display: inline-block;
    }

    /* ===== Buttons ===== */
    .row{
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    button{
      appearance: none;
      border: 1px solid rgba(98,140,169,.28);
      background: #fff;
      color: var(--text);
      padding: 11px 14px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .04s ease, box-shadow .14s ease, filter .14s ease;
    }

    button:active{ transform: translateY(1px); }

    .primary{
      border-color: rgba(98,140,169,.35);
      background: linear-gradient(180deg, var(--evapure-primary), var(--evapure-secondary));
      color: #fff;
      box-shadow: 0 12px 24px rgba(98,140,169,.22);
    }

    .ghost{
      background: rgba(137,195,236,.14);
      border-color: rgba(137,195,236,.40);
      color: var(--evapure-secondary);
    }

    .note{
      margin-top: 14px;
      color: var(--muted);
      font-size: 12.5px;
    }

    @media (max-width: 420px){
      .question{ font-size: 20px; }
      button{ flex: 1 1 auto; }
      .pill{ display:none; }
      .logoBox{ width: 46px; height: 46px; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="header">
      <div class="brand">
        <div class="logoBox" aria-label="Evapure logo">
          <!-- Put your logo file in the repo as evapure-logo.png -->
          <img src="evapure-logo.png" alt="Evapure" />
        </div>
        <div class="titles">
          <h1>Evapure Quiz</h1>
          <div class="sub">Scan • Play • Learn</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="question" id="question">Loading…</div>
  

      <div class="answer" id="answerBox">
        <div class="label"><span class="dot"></span>Answer</div>
        <div id="answer"></div>
      </div>

      <div class="row">
        <button class="primary" id="reveal">Reveal answer</button>
        <button id="next">Next question</button>
        <button class="ghost" id="reshuffle">Reshuffle bank</button>
      </div>

      <div class="note">
        Tip: “Next question” won’t repeat until the bank is exhausted (then reshuffle).
      </div>
    </div>

  </div>

<script>
  let bank = [];
  let pool = [];
  let current = null;

  async function loadBank(){
    const res = await fetch('questions.json', { cache: "no-store" });
    if(!res.ok) throw new Error('Could not load questions.json');
    const data = await res.json();
    if(!Array.isArray(data) || data.length === 0) throw new Error('Question bank empty/invalid');
    bank = data;
    
    reshuffle();
  }

  function shuffle(arr){
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function reshuffle(){
    pool = bank.slice();
    shuffle(pool);
    nextQ();
  }

  function nextQ(){
    document.getElementById('answerBox').style.display = 'none';

    if(pool.length === 0){
      document.getElementById('question').textContent = 'No more questions. Tap “Reshuffle bank”.';
      
      current = null;
      return;
    }

    current = pool.pop();
    document.getElementById('question').textContent = current.question ?? '(Missing question)';
    document.getElementById('answer').textContent = current.answer ?? '(Missing answer)';
    
  }

  document.getElementById('reveal').addEventListener('click', () => {
    if(!current) return;
    document.getElementById('answerBox').style.display = 'block';
  });

  document.getElementById('next').addEventListener('click', nextQ);
  document.getElementById('reshuffle').addEventListener('click', reshuffle);

  loadBank().catch(err => {
    document.getElementById('question').textContent = 'Couldn’t load the quiz bank.';
    document.getElementById('meta').textContent = err.message;
    document.getElementById('pill').textContent = 'Error';
    console.error(err);
  });
</script>
</body>
</html>
